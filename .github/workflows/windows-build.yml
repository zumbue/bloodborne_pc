name: Windows build

on:
  push:
    branches: [windows-cam-mouse]
    tags: [windows-v*]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # python.org Python: package.sh freezes the launcher with PyInstaller. MSYS2's Python is not used.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git patch curl perl
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-cross
            mingw-w64-clang-x86_64-protobuf
            mingw-w64-clang-x86_64-openssl
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-miniupnpc
            mingw-w64-clang-x86_64-nlohmann-json

      - name: FSR 4 assets
        run: bash tools/fetch_fsr4_assets.sh

      - name: Build
        run: bash build.sh

      # Same SDK files the 1.9 player zip ships: bbport_dlss.dll, nvngx_dlss.dll, nvngx_dlssg.dll.
      - name: DLSS bridge
        run: |
          git clone --depth 1 --branch v310.9.1 https://github.com/NVIDIA/DLSS.git out/dlss-sdk
          # The image cmake knows the Visual Studio that windows-latest actually ships.
          if [[ -x "/c/Program Files/CMake/bin/cmake.exe" ]]; then
            export CMAKE_EXE="/c/Program Files/CMake/bin/cmake.exe"
          fi
          DLSS_SDK_ROOT="$PWD/out/dlss-sdk" bash packaging/windows/build_dlss.sh

      - name: Package Bloodborne-Windows.zip
        run: |
          winpy=$(cygpath -u "$pythonLocation")/python.exe
          test -x "$winpy"
          WINPYTHON="$winpy" bash packaging/windows/package.sh
          cp -f dist/bbport-windows.zip dist/Bloodborne-Windows.zip
          "$winpy" packaging/windows/check_zip.py dist/Bloodborne-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Bloodborne-Windows
          path: dist/Bloodborne-Windows.zip
          if-no-files-found: error

      - name: Publish Windows release
        if: startsWith(github.ref, 'refs/tags/windows-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Windows camera + mouse ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: true
          fail_on_unmatched_files: true
          files: dist/Bloodborne-Windows.zip
